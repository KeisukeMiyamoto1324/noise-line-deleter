[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fineweb2-line-deleter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.30.0",
    "datasets>=2.19.0",
    "safetensors>=0.4.3",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "tqdm>=4.66.0",
    "transformers>=4.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
